# HACVSP stage execution matrix.
# Every stage runs inside a pinned container; the engagement directory is the
# single read-write source of truth; the pipeline repo is mounted read-only.
# Run:  hacvsp stage N --engagement <slug>      (wraps: docker compose run)
# Long-runners (09, 10, 12): hacvsp stage N --detach
name: hacvsp

x-stage-common: &stage-common
  image: ${TOOLS_IMAGE}
  working_dir: /engagement
  volumes:
    - ${ENGAGEMENT_DIR:-./engagements/_template}:/engagement
    - ./:/pipeline:ro
    - hacvsp-foundry:/root/.foundry
    - hacvsp-cargo:/root/.cargo
  env_file:
    - path: ${ENGAGEMENT_DIR:-./engagements/_template}/.env
      required: false

services:
  tools:
    build:
      context: .
      dockerfile: docker/hacvsp-tools.Dockerfile
      args:
        TOOLS_BASE: ${BASE_TOOLS_IMAGE}@${BASE_TOOLS_DIGEST}
        SOLC_VERSION: ${SOLC_VERSION}
        SOLC_COMMIT: ${SOLC_COMMIT}
        SOLC_SHA256: ${SOLC_SHA256}
        FOUNDRY_VERSION: ${FOUNDRY_VERSION}
        FOUNDRYUP_SHA256: ${FOUNDRYUP_SHA256}
        SLITHER_VERSION: ${SLITHER_VERSION}
        ADERYN_VERSION: ${ADERYN_VERSION}
        ADERYN_SHA256: ${ADERYN_SHA256}
        ECHIDNA_VERSION: ${ECHIDNA_VERSION}
        ECHIDNA_SHA256: ${ECHIDNA_SHA256}
        MEDUSA_VERSION: ${MEDUSA_VERSION}
        MEDUSA_SHA256: ${MEDUSA_SHA256}
        MYTHRIL_VERSION: ${MYTHRIL_VERSION}
        HALMOS_VERSION: ${HALMOS_VERSION}
        SCRIBBLE_VERSION: ${SCRIBBLE_VERSION}
        GAMBIT_VERSION: ${GAMBIT_VERSION}
        GAMBIT_SHA256: ${GAMBIT_SHA256}
        COSIGN_VERSION: ${COSIGN_VERSION}
        COSIGN_SHA256: ${COSIGN_SHA256}
        SYFT_VERSION: ${SYFT_VERSION}
        SYFT_SHA256: ${SYFT_SHA256}
        TRIVY_VERSION: ${TRIVY_VERSION}
        TRIVY_SHA256: ${TRIVY_SHA256}
    image: ${TOOLS_IMAGE}

  kontrol:
    build:
      context: .
      dockerfile: docker/kontrol.Dockerfile
      args:
        KONTROL_BASE: ${BASE_KONTROL_IMAGE}:${BASE_KONTROL_TAG}@${BASE_KONTROL_DIGEST}
    image: ${KONTROL_IMAGE}

  stage-01: { <<: *stage-common, command: ["/bin/bash", "/pipeline/stages/01-dependency-hygiene/run.sh"] }
  stage-02: { <<: *stage-common, command: ["/bin/bash", "/pipeline/stages/02-deterministic-build/run.sh"] }
  stage-03: { <<: *stage-common, command: ["/bin/bash", "/pipeline/stages/03-static-analysis/run.sh"] }
  stage-04: { <<: *stage-common, command: ["/bin/bash", "/pipeline/stages/04-event-emission/run.sh"] }
  stage-05: { <<: *stage-common, command: ["/bin/bash", "/pipeline/stages/05-storage-upgrade/run.sh"] }
  stage-06: { <<: *stage-common, command: ["/bin/bash", "/pipeline/stages/06-standards-compliance/run.sh"] }
  stage-07:
    <<: *stage-common
    command: ["/bin/bash", "/pipeline/stages/07-unit-diff-fork/run.sh"]
    environment:
      - HACVSP_FORK_RPC=${HACVSP_FORK_RPC:-}
  stage-08: { <<: *stage-common, command: ["/bin/bash", "/pipeline/stages/08-access-control/run.sh"] }
  stage-09: { <<: *stage-common, command: ["/bin/bash", "/pipeline/stages/09-mutation/run.sh"] }
  stage-10:
    <<: *stage-common
    command: ["/bin/bash", "/pipeline/stages/10-stateful-fuzzing/run.sh"]
    environment:
      - HACVSP_INV_RUNS=${HACVSP_INV_RUNS:-100000}
      - HACVSP_INV_DEPTH=${HACVSP_INV_DEPTH:-500}
  stage-11: { <<: *stage-common, command: ["/bin/bash", "/pipeline/stages/11-symbolic-bmc/run.sh"] }
  stage-12:
    <<: *stage-common
    image: ${KONTROL_IMAGE}
    command: ["/bin/bash", "/pipeline/stages/12-evm-theorem-proving/run.sh"]
    volumes:
      - ${ENGAGEMENT_DIR:-./engagements/_template}:/engagement
      - ./:/pipeline:ro
      - hacvsp-kontrol:/home/user/.kupyter
  stage-13: { <<: *stage-common, command: ["/bin/bash", "/pipeline/stages/13-expert-review/run.sh"] }
  stage-14: { <<: *stage-common, command: ["/bin/bash", "/pipeline/stages/14-attestation/run.sh"] }

volumes:
  hacvsp-foundry:
  hacvsp-cargo:
  hacvsp-kontrol:
