# HACVSP Workstation — SPEC v0.1.0 locked compiler settings
# Stage 2 asserts these values; do not drift without a spec change.
[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.38"
via_ir = true
optimizer = true
optimizer_runs = 200
bytecode_hash = "ipfs"
cbor_metadata = true
fs_permissions = [{ access = "read", path = "./" }]
fuzz = { runs = 256 }
invariant = { runs = 256, depth = 500, fail_on_revert = false }

# Stage 11 — solc SMTChecker (bmc + chc), spec-locked targets/timeout
[profile.default.model_checker]
engine = "all"
targets = ["assert", "underflow", "overflow", "divByZero", "balance"]
timeout = 120000

# Release-tier override example (stage 10 runs with explicit flags):
#   forge test --match-contract Invariant --fuzz-runs 100000 --depth 500

[profile.ci]
fuzz = { runs = 5000 }
invariant = { runs = 1000, depth = 100, fail_on_revert = false }

# See docs/OPERATIONS.md — RPC and secrets live in per-engagement .env (0600).
